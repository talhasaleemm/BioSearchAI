name: biosearchai
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  # Python 3.11 matches the Dockerfile — safest for all ML wheels
  - python=3.11

  # Heavy C/C++ / Rust-compiled packages — installed from Conda pre-built binaries
  # This bypasses the MSVC link.exe requirement entirely on Windows
  - conda-forge::tokenizers>=0.19,<0.21
  - conda-forge::sentencepiece>=0.2.0
  - pytorch::pytorch>=2.2.0,<2.5.0
  - pytorch::torchvision
  - conda-forge::numpy>=1.26,<2.0

  # Build tools for any remaining pip packages that need minimal compilation
  - conda-forge::cmake
  - conda-forge::make

  # pip: pure-Python packages that install cleanly on all platforms
  - pip
  - pip:
    - fastapi==0.115.0
    - uvicorn==0.30.6
    - sqlalchemy==2.0.35
    - pydantic==2.9.2
    - pydantic-settings==2.5.2
    - PyJWT[crypto]==2.13.0
    - pwdlib[argon2]==0.2.0
    - email-validator==2.2.0
    - biopython==1.85
    - pymupdf==1.24.14
    - sentence-transformers==3.3.1
    - transformers==4.41.2
    - pgvector==0.5.0
    - psycopg2-binary==2.9.12
    - pandas==2.2.3
    - alembic==1.14.1
    - openai==1.54.4
    - pytest==8.3.4
    - celery==5.4.0
    - redis==5.2.1
    - httpx>=0.27.0
